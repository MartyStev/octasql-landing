version: '3.8'

services:
  semantic-landing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semantic-landing
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
